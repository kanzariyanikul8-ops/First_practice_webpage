<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
    <link rel="stylesheet" href="./login.css">
</head>
<body>
    <div class="loginformcnt">
        <div class="innerbox box1">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/071/581/619/small/3d-cartoon-adult-male-teacher-character-standing-working-on-laptop-png.png" alt="" height="586px" width="455px">
        </div>
        <div class="innerbox">
            <h2 style="text-align: center; padding-top: 20px;">Flipkart</h2>
            <form class="frm" action="">
                <fieldset>
                    <legend style="text-align: center;">Login Page</legend><br>
                    <label  for="un" style="margin-left: 80px;">Username: </label>
                    <input type="text" name="Username" id="un" placeholder="Enter Username">
                    <br>
                    <br>
                    <label for="pass" style="margin-left: 80px;">Password: </label>
                    <input type="password" name="Password" id="pass" placeholder="Enter Password">
                    <br>
                    <br>
                    <button type="reset" style="margin-left: 140px;">Cancel</button>
                    <button type="submit" style="margin-left: 30px;">Submit</button>
                </fieldset>
            </form>
        </div>
    </div>
</body>
</html>
